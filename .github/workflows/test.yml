name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The Admin UI SDK V2 libraries need Node 22 or later (engines >=22), so 20 is no longer tested here.
        # The data actions still deploy as runtime nodejs:20 (the generated App Management actions as nodejs:24):
        # the nodejs:20 deploy runtime is not covered by CI. 24 is what the lock file was made with.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lock file is npm 11; Node 22 ships npm 10, which reads it differently.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
