application:
  actions: actions
  runtimeManifest:
    packages:
      # Order sync to an ERP. Ep 1 introduced export-order as a web action; it is now invoked by
      # Adobe I/O Events (observer.sales_order_place_after), so it is not public and needs no web URL.
      order-sync:
        license: Apache-2.0
        actions:
          export-order:
            function: actions/export-order/index.js
            runtime: nodejs:20
            web: 'no'
            inputs:
              LOG_LEVEL: info
              ERP_API_URL: $ERP_API_URL
              ERP_API_KEY: $ERP_API_KEY
            annotations:
              final: true
            limits:
              timeout: 60000
              memory: 256
          export-order-retry:
            function: actions/export-order-retry/index.js
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              ERP_API_URL: $ERP_API_URL
              ERP_API_KEY: $ERP_API_KEY
              MAX_PER_RUN: 50
            annotations:
              final: true
            limits:
              # Keep this below the 10-minute alarm period, so scheduled runs never overlap;
              # a State lock covers a manual invoke during a scheduled run.
              timeout: 300000
              memory: 256
        triggers:
          every10Minutes:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: '*/10 * * * *'
        rules:
          orderSyncRetrySchedule:
            trigger: every10Minutes
            action: export-order-retry
      # Ep 3: a scheduled job. Not a web action: nothing outside should call it.
      ops:
        actions:
          stuck-orders:
            function: actions/stuck-orders/index.js
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              COMMERCE_BASE_URL: $COMMERCE_BASE_URL
              COMMERCE_TOKEN: $COMMERCE_TOKEN
              ALERT_WEBHOOK_URL: $ALERT_WEBHOOK_URL
              STUCK_AFTER_MINUTES: 30
              SAVE_REPORT: false
            annotations:
              final: true
        triggers:
          every15Minutes:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: '*/15 * * * *'
        rules:
          stuckOrdersSchedule:
            trigger: every15Minutes
            action: stuck-orders
