application:
  actions: actions
  hooks:
    # Ep 4: create the database indexes after every deploy (skips the ones that exist).
    post-app-deploy: node scripts/post-deploy-db-setup.js
  runtimeManifest:
    # Ep 4: Database Storage, one database per workspace. Auto-provisioned on `aio app deploy`
    # (not on `aio app run` or `aio app dev`). The region must match the one in actions/sync-log.
    database:
      auto-provision: true
      region: emea
    packages:
      # Order sync to an ERP. Ep 1 introduced export-order as a web action; it is now invoked by
      # Adobe I/O Events (observer.sales_order_place_after), so it is not public and needs no web URL.
      order-sync:
        license: Apache-2.0
        actions:
          export-order:
            function: actions/export-order/index.js
            runtime: nodejs:20
            web: 'no'
            inputs:
              LOG_LEVEL: info
              ERP_API_URL: $ERP_API_URL
              ERP_API_KEY: $ERP_API_KEY
            annotations:
              final: true
            limits:
              timeout: 60000
              memory: 256
          export-order-retry:
            function: actions/export-order-retry/index.js
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              ERP_API_URL: $ERP_API_URL
              ERP_API_KEY: $ERP_API_KEY
              MAX_PER_RUN: 50
            annotations:
              final: true
            limits:
              # Keep this below the 10-minute alarm period, so scheduled runs never overlap;
              # a State lock covers a manual invoke during a scheduled run.
              timeout: 300000
              memory: 256
          # Ep 4: writes a row per export attempt to the export_runs collection and returns the latest failure for a SKU.
          sync-log:
            function: actions/sync-log/index.js
            runtime: nodejs:20
            web: 'no'
            inputs:
              LOG_LEVEL: info
            annotations:
              # The action receives the workspace's OAuth credentials, which aio-lib-db needs for its token.
              include-ims-credentials: true
              final: true
        triggers:
          every10Minutes:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: '*/10 * * * *'
        rules:
          orderSyncRetrySchedule:
            trigger: every10Minutes
            action: export-order-retry
      # Ep 6: the order-placed handler from the post, invoked by Adobe I/O Events (not a web action).
      # order-sync/export-order is the full version (Ep 10): register only one of the two for the event.
      events:
        license: Apache-2.0
        actions:
          order-placed:
            function: actions/order-placed/index.js
            runtime: nodejs:20
            web: 'no'
            inputs:
              LOG_LEVEL: info
              ERP_API_URL: $ERP_API_URL
              ERP_API_KEY: $ERP_API_KEY
            annotations:
              # Receives the workspace's OAuth credentials, which aio-lib-db needs for its token.
              include-ims-credentials: true
              final: true
      # Ep 3: a scheduled job. Not a web action: nothing outside should call it.
      ops:
        actions:
          stuck-orders:
            function: actions/stuck-orders/index.js
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              COMMERCE_BASE_URL: $COMMERCE_BASE_URL
              COMMERCE_TOKEN: $COMMERCE_TOKEN
              ALERT_WEBHOOK_URL: $ALERT_WEBHOOK_URL
              STUCK_AFTER_MINUTES: 30
              SAVE_REPORT: false
            annotations:
              final: true
        triggers:
          every15Minutes:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: '*/15 * * * *'
        rules:
          stuckOrdersSchedule:
            trigger: every15Minutes
            action: stuck-orders
      # Ep 7: a Commerce webhook endpoint (observer.checkout_cart_product_add_before). Commerce calls it, so it is a
      # web action; raw-http gives the action the exact signed bytes. The signature is checked in the code.
      webhooks:
        license: Apache-2.0
        actions:
          cart-check:
            function: actions/cart-check/index.js
            runtime: nodejs:20
            web: 'yes'
            inputs:
              LOG_LEVEL: info
              PUBLIC_KEY: $PUBLIC_KEY
              RESTRICTED_SKUS: $RESTRICTED_SKUS
            annotations:
              raw-http: true
              final: true
