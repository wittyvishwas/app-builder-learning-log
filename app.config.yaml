application:
  actions: actions
  hooks:
    # Ep 4: create the database indexes after every deploy (skips the ones that exist).
    post-app-deploy: node scripts/post-deploy-db-setup.js
  runtimeManifest:
    # Ep 4: Database Storage, one database per workspace. Auto-provisioned on `aio app deploy`
    # (not on `aio app run` or `aio app dev`). The region must match the one in actions/sync-log.
    database:
      auto-provision: true
      region: emea
    packages:
      # Order sync to an ERP. Ep 1 introduced export-order as a web action; it is now invoked by
      # Adobe I/O Events (observer.sales_order_place_after), so it is not public and needs no web URL.
      order-sync:
        license: Apache-2.0
        actions:
          export-order:
            function: actions/export-order/index.js
            runtime: nodejs:20
            web: 'no'
            inputs:
              LOG_LEVEL: info
              ERP_API_URL: $ERP_API_URL
              ERP_API_KEY: $ERP_API_KEY
            annotations:
              # Database Storage needs the workspace's OAuth credentials (export_runs holds the order bookkeeping).
              include-ims-credentials: true
              final: true
            limits:
              timeout: 60000
              memory: 256
          export-order-retry:
            function: actions/export-order-retry/index.js
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              ERP_API_URL: $ERP_API_URL
              ERP_API_KEY: $ERP_API_KEY
              MAX_PER_RUN: 50
            annotations:
              # Database Storage needs the workspace's OAuth credentials, also when the alarm trigger runs the action.
              include-ims-credentials: true
              final: true
            limits:
              # Keep this below the 10-minute alarm period, so scheduled runs never overlap;
              # a State lock (the only thing order sync keeps in State) covers a manual invoke during a scheduled run.
              timeout: 300000
              memory: 256
          # Ep 4: writes a row per export attempt to the export_runs collection and returns the latest failure for a SKU.
          sync-log:
            function: actions/sync-log/index.js
            runtime: nodejs:20
            web: 'no'
            inputs:
              LOG_LEVEL: info
            annotations:
              # The action receives the workspace's OAuth credentials, which aio-lib-db needs for its token.
              include-ims-credentials: true
              final: true
        triggers:
          every10Minutes:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: '*/10 * * * *'
        rules:
          orderSyncRetrySchedule:
            trigger: every10Minutes
            action: export-order-retry
      # Ep 6: the order-placed handler from the post, invoked by Adobe I/O Events (not a web action).
      # order-sync/export-order is the full version (Ep 10): register only one of the two for the event.
      events:
        license: Apache-2.0
        actions:
          order-placed:
            function: actions/order-placed/index.js
            runtime: nodejs:20
            web: 'no'
            inputs:
              LOG_LEVEL: info
              ERP_API_URL: $ERP_API_URL
              ERP_API_KEY: $ERP_API_KEY
            annotations:
              # Receives the workspace's OAuth credentials, which aio-lib-db needs for its token.
              include-ims-credentials: true
              final: true
      # Ep 3: a scheduled job. Not a web action: nothing outside should call it.
      ops:
        actions:
          stuck-orders:
            function: actions/stuck-orders/index.js
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              COMMERCE_BASE_URL: $COMMERCE_BASE_URL
              COMMERCE_TOKEN: $COMMERCE_TOKEN
              ALERT_WEBHOOK_URL: $ALERT_WEBHOOK_URL
              STUCK_AFTER_MINUTES: 30
              SAVE_REPORT: false
            annotations:
              # Ep 9: the job also writes each alert to the stuck_alerts collection, which needs the workspace's OAuth credentials.
              include-ims-credentials: true
              final: true
        triggers:
          every15Minutes:
            feed: /whisk.system/alarms/alarm
            inputs:
              cron: '*/15 * * * *'
        rules:
          stuckOrdersSchedule:
            trigger: every15Minutes
            action: stuck-orders
      # Ep 7: a Commerce webhook endpoint (observer.sales_quote_add_item). Commerce calls it, so it is a
      # web action; raw-http gives the action the exact signed bytes. The signature is checked in the code.
      # Verified on Stage with dev:run, GraphQL and REST.
      webhooks:
        license: Apache-2.0
        actions:
          cart-check:
            function: actions/cart-check/index.js
            runtime: nodejs:20
            web: 'yes'
            inputs:
              LOG_LEVEL: info
              PUBLIC_KEY: $PUBLIC_KEY
              RESTRICTED_SKUS: $RESTRICTED_SKUS
            annotations:
              raw-http: true
              final: true
      # Test helper, not part of the order-sync design: a fake ERP as a public web action (actions/fake-erp), so a
      # real-workspace run has an ERP to send to. It deploys with every `aio app deploy`, Production workspaces too.
      dev:
        license: Apache-2.0
        actions:
          fake-erp:
            function: actions/fake-erp/index.js
            runtime: nodejs:20
            web: 'yes'
            inputs:
              LOG_LEVEL: info
              FAKE_ERP_API_KEY: $FAKE_ERP_API_KEY
            annotations:
              require-adobe-auth: false
              final: true
          # Ep 8 run: fake review and stock sources for API Mesh (actions/fake-reviews). raw-http gives the action the
          # unparsed query string; the key is checked in the code.
          fake-reviews:
            function: actions/fake-reviews/index.js
            runtime: nodejs:20
            web: 'yes'
            inputs:
              LOG_LEVEL: info
              FAKE_REVIEWS_API_KEY: $FAKE_REVIEWS_API_KEY
            annotations:
              require-adobe-auth: false
              raw-http: true
              final: true
            limits:
              timeout: 60000
              memory: 256
          # Ep 11: test helper, never deploy to Production. Runs State, Files and Database Storage calls (?op=state|files|db)
          # and returns which ones worked (actions/ep11-probe). It deploys with every `aio app deploy`, like the others here.
          # Non-web on purpose: deployed, only a caller with the namespace auth can invoke it. A web action with
          # require-adobe-auth becomes a web sequence in front of `__secured_ep11-probe`, request params reach the action
          # and override its inputs (EP11_PROBE_ENABLED included), and `final` does not protect the inner action.
          # `aio app dev` still serves it over HTTP (with a warning): https://localhost:9080/api/v1/web/dev/ep11-probe?op=...
          ep11-probe:
            function: actions/ep11-probe/index.js
            runtime: nodejs:20
            web: 'no'
            inputs:
              LOG_LEVEL: info
              # Second guard: the action answers 403 unless this is '1'. Set it only in the shell of `aio app dev`, never in .env.
              EP11_PROBE_ENABLED: $EP11_PROBE_ENABLED
            annotations:
              # The db op needs the workspace's OAuth credentials for aio-lib-db's token.
              include-ims-credentials: true
# Ep 9: Admin UI SDK V2 (App Management). Layout copied from Adobe's sample
# adobe-commerce-samples/admin-ui-sdk/v2/menu/custom-menu. Keep commerce/extensibility/1 last.
extensions:
  commerce/backend-ui/2:
    $include: src/commerce-backend-ui-2/ext.config.yaml
  commerce/extensibility/1:
    $include: src/commerce-extensibility-1/ext.config.yaml
