# Ep 9: layout and hooks copied from Adobe's v2 custom-menu sample
# (adobe-commerce-samples/admin-ui-sdk/v2/menu/custom-menu). Both data actions are web actions that need
# the signed-in admin's Adobe identity (require-adobe-auth). Neither has a per-action ACL, so each action also checks the
# token's client_id against ALLOWED_CLIENT_IDS (.env, comma-separated; empty refuses every call).
web: web-src
# The [pre-app-build] hooks are auto-generated. Do not remove or manually edit.
hooks:
  pre-app-build: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-build
  pre-app-dev: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-dev
  pre-app-run: EXTENSION=backend-ui/2 npx aio-commerce-lib-app hooks pre-app-run
operations:
  view:
    - type: web
      impl: index.html
runtimeManifest:
  packages:
    StuckOrders:
      license: Apache-2.0
      actions:
        list-alerts:
          function: actions/list-alerts/index.js
          web: 'yes'
          runtime: 'nodejs:20'
          inputs:
            LOG_LEVEL: info
            ALLOWED_CLIENT_IDS: $ALLOWED_CLIENT_IDS
          annotations:
            require-adobe-auth: true
            # Gives aio-lib-db the workspace's OAuth credentials (same as sync-log).
            include-ims-credentials: true
            final: true
        mark-handled:
          function: actions/mark-handled/index.js
          web: 'yes'
          runtime: 'nodejs:20'
          inputs:
            LOG_LEVEL: info
            ALLOWED_CLIENT_IDS: $ALLOWED_CLIENT_IDS
          annotations:
            require-adobe-auth: true
            include-ims-credentials: true
            final: true
        list-deliveries:
          function: actions/list-deliveries/index.js
          web: 'yes'
          runtime: 'nodejs:20'
          inputs:
            LOG_LEVEL: info
            ALLOWED_CLIENT_IDS: $ALLOWED_CLIENT_IDS
          annotations:
            require-adobe-auth: true
            include-ims-credentials: true
            final: true
        retry-delivery:
          function: actions/retry-delivery/index.js
          web: 'yes'
          runtime: 'nodejs:20'
          inputs:
            LOG_LEVEL: info
            ALLOWED_CLIENT_IDS: $ALLOWED_CLIENT_IDS
            # A dead row keeps no order, so Retry fetches it again from Commerce (same inputs as ops/stuck-orders).
            COMMERCE_BASE_URL: $COMMERCE_BASE_URL
            COMMERCE_TOKEN: $COMMERCE_TOKEN
          annotations:
            require-adobe-auth: true
            include-ims-credentials: true
            final: true
